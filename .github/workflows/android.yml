name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          # The 'yes |' prefix forces automated "yes" answers to SDK prompts
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4-PKG-Streamer-debug-APK
          path: .buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/ps4pkgstreamer__armeabi-v7a/build/outputs/apk/debug/*.apk
          if-no-files-found: error
